<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FreshMart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>FreshMart Grocery Store</h1>
    <p>Your Shopping Cart</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
</nav>

<main class="cart-container">
    <h2>Shopping Cart</h2>

    <div id="cart-items"></div>

    <div class="cart-total" id="cart-total"></div>

    <div class="cart-actions">
        <a class="button" href="products.html">Continue Shopping</a>
        <button class="button" id="checkout-button">Demo Checkout</button>
    </div>

    <p id="checkout-message"></p>
</main>

<script src="products.js"></script>
<script src="shop.js"></script>

<script>
    const cartItems = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    const checkoutMessage = document.getElementById("checkout-message");

    function renderCart() {
        const cart = getCart();

        cartItems.innerHTML = "";
        checkoutMessage.textContent = "";

        if (cart.length === 0) {
            cartItems.innerHTML = "<p>Your cart is empty.</p>";
            cartTotal.textContent = "";
            return;
        }

        let total = 0;

        cart.forEach(function(cartItem) {
            const product = getProductById(cartItem.id);

            if (!product) return;

            const itemTotal = product.price * cartItem.quantity;
            total += itemTotal;

            cartItems.innerHTML += `
                <div class="cart-item">
                    <img src="${product.image}" alt="${product.name}">

                    <div class="cart-item-info">
                        <h3>${product.name}</h3>
                        <p>Price: ₹${product.price}</p>
                        <p>Quantity: ${cartItem.quantity}</p>
                        <p><strong>Subtotal: ₹${itemTotal}</strong></p>

                        <div class="quantity-controls">
                            <button class="small-button"
                                    onclick="changeQuantity('${product.id}', -1)">
                                −
                            </button>

                            <button class="small-button"
                                    onclick="changeQuantity('${product.id}', 1)">
                                +
                            </button>

                            <button class="small-button remove-button"
                                    onclick="removeFromCart('${product.id}')">
                                Remove
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });

        cartTotal.innerHTML = `<h3>Total: ₹${total}</h3>`;
    }

    function changeQuantity(productId, change) {
        const cart = getCart();
        const item = cart.find(item => item.id === productId);

        if (!item) return;

        item.quantity += change;

        if (item.quantity <= 0) {
            const updatedCart = cart.filter(item => item.id !== productId);
            saveCart(updatedCart);
        } else {
            saveCart(cart);
        }

        updateNavigation();
        renderCart();
    }

    function removeFromCart(productId) {
        const updatedCart = getCart().filter(item => item.id !== productId);

        saveCart(updatedCart);
        updateNavigation();
        renderCart();
    }

    document.getElementById("checkout-button").addEventListener("click", function() {
        if (!isLoggedIn()) {
            alert("Please login before checkout.");
            window.location.href = "login.html?next=cart";
            return;
        }

        if (getCart().length === 0) {
            checkoutMessage.textContent = "Your cart is empty.";
            return;
        }

        checkoutMessage.textContent =
            "Demo checkout completed. No real order or payment was processed.";
    });

    renderCart();
</script>

</body>
</html>
